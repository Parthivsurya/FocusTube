<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>FocusTube — distraction-free Shorts</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app">
    <div class="brand">
      <span class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
      </span>
      <span>FocusTube</span>
    </div>
    <div class="tagline">Search any topic — only watch what you came for</div>

    <div class="search-row">
      <input id="search-input" type="text" placeholder="Search a topic…" autocomplete="off" />
      <button id="search-btn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <span>Search</span>
      </button>
    </div>

    <div id="chips" class="chips"></div>

    <div class="section-label">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
      Saved topics
    </div>
    <div id="topics" class="topics"></div>

    <div id="player" class="player">
      <div class="placeholder">
        <div class="play-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <h3>Click a video below to play it here</h3>
        <p>No YouTube redirects. No distractions.</p>
      </div>
    </div>

    <div id="results-meta" class="results-meta"></div>
    <div id="grid" class="grid"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
